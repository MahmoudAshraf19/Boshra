# Privacy Policy

**Last Updated: September 7, 2026**

Welcome to **Boshra**.

We respect your privacy and are committed to protecting your personal data. This Privacy Policy explains how the **Boshra** application may access, use, and handle information when you use the app.

By using Boshra, you agree to the practices described in this Privacy Policy.

## 1. Information We May Access

Boshra may require access to certain information or device permissions to provide its core features, including:

### Location Information

The app may request access to your location in order to:

* Determine prayer times based on your location.
* Improve the accuracy of prayer time calculations.
* Determine the Qibla direction.
* Provide location-based features within the app.

The app does not require sharing your location with other users in order for you to use these features.

You can revoke location permission at any time through your device settings. However, some location-based features may not function properly without this permission.

### Notifications

The app may request permission to send notifications for:

* Prayer time reminders.
* Adhan notifications.
* Reminders related to adhkar or other features you choose to enable.

You can disable notifications at any time through your device settings.

### Device Information

The app may process certain basic technical information required to operate the app and improve its stability, such as your device type, operating system version, and app version. This information is used only as necessary to operate the service or diagnose technical issues when supported technical services are used.

## 2. How We Use Information

Information available to the app may be used to:

* Provide the app’s core features.
* Calculate accurate prayer times.
* Determine the Qibla direction.
* Send notifications that you choose to enable.
* Improve the app’s performance and stability.
* Identify and resolve technical errors and issues when necessary.
* Protect the app from harmful or unauthorized use.

## 3. Information Sharing

We do not sell your personal information.

Some data may be processed by technical service providers used by the app to provide its features. Such processing is limited to what is necessary to operate the service or provide the requested functionality.

We do not share your personal information with third parties for marketing purposes without a lawful basis or the consent required by applicable law.

## 4. Location Data

Location data is used only when necessary to provide location-based features, such as prayer times and Qibla direction.

We do not use your location to create a profile of your movements or sell your location history to third parties.

## 5. Data Storage and Security

We strive to use appropriate technical and organizational measures to help protect information from unauthorized access, alteration, disclosure, or destruction.

However, no method of electronic transmission or storage can be guaranteed to be completely secure.

## 6. Data Retention

We retain information only for as long as necessary to provide the requested features, fulfill legal or technical obligations, or as required by the nature of the service being used.

You may request the deletion of data associated with you when applicable to the type of data and service involved.

## 7. Third-Party Services

The app may rely on certain third-party services to provide technical functionality, such as hosting services, mapping services, system services, or infrastructure used to operate the app.

These services may process certain information in accordance with their own privacy policies.

We encourage you to review the privacy policies of relevant third-party service providers.

## 8. Children’s Privacy

Boshra is not specifically directed at children under the age defined by applicable law, and we do not knowingly collect personal information from children.

If we become aware that a child’s personal information has been collected unintentionally, we will take appropriate steps to address the situation in accordance with applicable laws.

## 9. User Rights

Depending on applicable laws and the nature of the data, you may have certain rights regarding your information, including:

* The right to know what data is being processed.
* The right to request correction of inaccurate information.
* The right to request deletion of certain data.
* The right to withdraw permissions granted to the app.
* The right to object to certain types of data processing where permitted by law.

You can manage location and notification permissions through your device settings.

## 10. Data Deletion

Boshra does not require or provide user accounts. If you would like to request the deletion of personal data that may have been processed in connection with your use of the app, you can contact us using the email address provided in Section 12.

When a deletion request is received, we will review and process it as applicable to the type of data involved. Certain information may be retained only when required by law or necessary for legitimate purposes.

You can also delete locally stored app data by clearing the app’s storage or uninstalling Boshra through your device settings. Uninstalling the app may not delete information that has already been processed by third-party service providers, where applicable.

## 11. Changes to This Privacy Policy

We may update this Privacy Policy from time to time to reflect changes to the app, services, or applicable legal requirements.

When significant changes are made, the “Last Updated” date at the top of this page will be updated. Users may also be notified within the app when appropriate.

## 12. Contact Us

If you have any questions or concerns regarding this Privacy Policy or your data, or if you would like to request data deletion, you can contact us by email:

[**mahmoudashraf.eng19@gmail.com**](mailto:mahmoudashraf.eng19@gmail.com)

## 13. Consent

By using the **Boshra** application, you acknowledge that you have read and understood this Privacy Policy and agree to the handling of information as described herein.

---

**Boshra**

An Islamic application designed to provide a simple and reliable experience for accessing the Holy Quran, adhkar, prayer times, Qibla direction, notifications, and other Islamic features.
