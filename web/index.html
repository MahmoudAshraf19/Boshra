  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #12180F;
      color: #F5F1E3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Cairo", "Tajawal", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #boshra-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1C2417 0%, #12180F 75%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s ease;
      padding: 24px;
      text-align: center;
      user-select: none;
    }

    #boshra-splash.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Ambient Islamic Geometric Pattern */
    .splash-bg-pattern {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.035;
      background-image: radial-gradient(#DDA15E 1.5px, transparent 1.5px), radial-gradient(#606C38 1.5px, #12180F 1.5px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      pointer-events: none;
    }

    .splash-content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 440px;
      width: 100%;
    }

    /* Logo Aura & Container */
    .logo-container {
      position: relative;
      width: 130px;
      height: 130px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-aura {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(221, 161, 94, 0.22) 0%, rgba(96, 108, 56, 0.1) 50%, transparent 70%);
      animation: auraPulse 3s ease-in-out infinite alternate;
    }

    .logo-ring {
      position: absolute;
      width: 138px;
      height: 138px;
      border-radius: 50%;
      border: 1.5px solid rgba(221, 161, 94, 0.35);
      border-top-color: #DDA15E;
      animation: ringRotate 8s linear infinite;
    }

    .app-logo {
      width: 116px;
      height: 116px;
      border-radius: 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 20px rgba(221, 161, 94, 0.25);
      object-fit: cover;
      position: relative;
      z-index: 2;
    }

    /* Typography */
    .app-name {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #FFFFFF 20%, #FEFAE0 60%, #DDA15E 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .app-tagline {
      font-size: 15px;
      color: #DDA15E;
      font-weight: 500;
      margin-bottom: 20px;
      letter-spacing: 0.2px;
      opacity: 0.95;
    }

    /* Features Badges */
    .features-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
      padding: 0 10px;
    }

    .feature-badge {
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(40, 54, 24, 0.55);
      border: 1px solid rgba(221, 161, 94, 0.25);
      color: #E8E4D5;
      backdrop-filter: blur(8px);
    }

    /* Loading Bar */
    .loader-box {
      width: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      border-radius: 4px;
      background: linear-gradient(90deg, #606C38 0%, #DDA15E 50%, #A3B56B 100%);
      animation: progressAnim 1.6s ease-in-out infinite;
    }

    .loading-text {
      font-size: 13px;
      color: #B8B9A8;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    @keyframes auraPulse {
      0% { transform: scale(0.92); opacity: 0.6; }
      100% { transform: scale(1.18); opacity: 1; }
    }

    @keyframes ringRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes progressAnim {
      0% { left: -45%; width: 30%; }
      50% { left: 30%; width: 60%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
</head>
<body>
  <!-- Boshra Islamic Splash & Loader -->
  <div id="boshra-splash">
    <div class="splash-bg-pattern"></div>
    <div class="splash-content">
      <div class="logo-container">
        <div class="logo-aura"></div>
        <div class="logo-ring"></div>
        <img class="app-logo" src="icons/logo.png" alt="Boshra Logo" width="116" height="116">

      <h1 class="app-name" id="app-name">بُشرى</h1>
      <p class="app-tagline" id="app-tagline">رفيقك في طريق الخير</p>
      
      <div class="features-list" id="features-list">
        <span class="feature-badge">القرآن الكريم</span>
        <span class="feature-badge">مواقيت الصلاة والأذان</span>
        <span class="feature-badge">165+ إذاعة إسلامية</span>
        <span class="feature-badge">الأذكار والقبلة</span>
      </div>

      <div class="loader-box">
        <div class="progress-track">
          <div class="progress-bar"></div>
        </div>
        <span class="loading-text" id="loading-text">جاري فتح التطبيق...</span>

    </div>

  <!-- Multi-Language Data & Initialization -->
  <script>
    (function () {
      const LOCALES = {
        ar: {
          title: "بُشرى | رفيقك في طريق الخير - القرآن الكريم ومواقيت الصلاة والأذكار",
          appName: "بُشرى",
          tagline: "رفيقك في طريق الخير",
          description: "تطبيق إسلامي شامل يضم القرآن الكريم بتلاوات خاشعة، 165+ إذاعة قرآنية، مواقيت الصلاة وأصوات الأذان، اتجاه القبلة، والأذكار.",
          features: ["القرآن الكريم", "مواقيت الصلاة والأذان", "165+ إذاعة إسلامية", "الأذكار والقبلة"],
          loading: "جاري فتح التطبيق...",
          dir: "rtl"
        },
        en: {
          title: "Boshra | Your Islamic Companion - Quran, Prayer Times & Azkar",
          appName: "Boshra",
          tagline: "Your Islamic Companion",
          description: "Comprehensive Islamic app featuring the Holy Quran with multiple recitations, 165+ Quran radios, accurate prayer times & Adhan, Qibla and Azkar.",
          features: ["Holy Quran", "Prayer Times & Adhan", "165+ Islamic Radios", "Azkar & Qibla"],
          loading: "Opening Boshra...",
          dir: "ltr"
        },
        es: {
          title: "Boshra | Tu Compañero Islámico - Sagrado Corán y Horarios de Oración",
          appName: "Boshra",
          tagline: "Tu Compañero Islámico",
          description: "Aplicación islámica integral: Sagrado Corán con diversas recitaciones, 165+ radios coránicas, horarios de oración, Adhan, Qibla y Azkar.",
          features: ["Sagrado Corán", "Horarios de Oración", "165+ Radios Islámicas", "Azkar y Qibla"],
          loading: "Abriendo Boshra...",
          dir: "ltr"
        },
        fa: {
          title: "بشری | همراه معنوی شما - قرآن کریم، اوقات شرعی و اذکار",
          appName: "بُشری",
          tagline: "همراه معنوی شما",
          description: "نرم‌افزار جامع اسلامی شامل قرآن کریم با قرائت‌های گوناگون، بیش از ۱۶۵ رادیوی قرآنی، اوقات شرعی و اذان، قبله‌نما و اذکار.",
          features: ["قرآن کریم", "اوقات شرعی و اذان", "۱۶۵+ رادیوی اسلامی", "اذکار و قبله"],
          loading: "در حال بارگذاری...",
          dir: "rtl"
        },
        fr: {
          title: "Boshra | Votre Compagnon Islamique - Saint Coran et Horaires de Prière",
          appName: "Boshra",
          tagline: "Votre Compagnon Islamique",
          description: "Application islamique complète : Saint Coran, 165+ radios coraniques, horaires de prière précis, Adhan, Qibla et Azkar.",
          features: ["Saint Coran", "Horaires de Prière & Adhan", "165+ Radios", "Azkar & Qibla"],
          loading: "Ouverture de l'application...",
          dir: "ltr"
        },
        hi: {
          title: "बुशरा | आपका इस्लामी साथी - पवित्र क़ुरआन और नमाज़ का समय",
          appName: "बुशरा",
          tagline: "आपका इस्लामी साथी",
          description: "पवित्र क़ुरआन, 165+ इस्लामी रेडियो, नमाज़ का सही समय, अज़ान, क़िबला और अज़कार के साथ मुकम्मल इस्लाمی ऐप।",
          features: ["पवित्र क़ुरआन", "नमाज़ का समय व अज़ान", "165+ इस्लामी रेडियो", "अज़कार व क़िबला"],
          loading: "ऐप लोड हो रहा है...",
          dir: "ltr"
        },
        it: {
          title: "Boshra | Il Tuo Compagno Islamico - Sacro Corano e Orari di Preghiera",
          appName: "Boshra",
          tagline: "Il Tuo Compagno Islamico",
          description: "Applicazione islamica completa con il Sacro Corano, oltre 165 radio coraniche in diretta, orari di preghiera, Adhan, Qibla e Azkar.",
          features: ["Sacro Corano", "Orari di Preghiera & Adhan", "165+ Radio Islamiche", "Azkar e Qibla"],
          loading: "Caricamento in corso...",
          dir: "ltr"
        },
        ur: {
          title: "بشریٰ | آپ کا اسلامی رفیق - قرآن کریم، اوقاتِ نماز اور اذکار",
          appName: "بشریٰ",
          tagline: "آپ کا اسلامی رفیق",
          description: "قرآن کریم، 165+ اسلامی ریڈیو، نماز کے درست اوقات، اذان، قبلہ اور اذکار کے ساتھ جامع اسلامی ایپ۔",
          features: ["قرآن کریم", "اوقاتِ نماز و اذان", "165+ اسلامی ریڈیو", "اذکار اور قبلہ"],
          loading: "ایپ لوڈ ہو رہی ہے...",
          dir: "rtl"
        }
      };

      function detectLanguage() {
        const urlParams = new URLSearchParams(window.location.search);
        const queryLang = urlParams.get('lang');
        if (queryLang && LOCALES[queryLang.toLowerCase()]) {
          return queryLang.toLowerCase();
        }

        try {
          const stored = localStorage.getItem('preferred_language') || localStorage.getItem('flutter.languageCode');
          if (stored) {
            const clean = stored.replace(/"/g, '').toLowerCase();
            if (LOCALES[clean]) return clean;
          }
        } catch (e) {}

        const browserLangs = navigator.languages || [navigator.language || navigator.userLanguage || 'ar'];
        for (let l of browserLangs) {
          const code = l.split('-')[0].toLowerCase();
          if (LOCALES[code]) return code;
        }
        return 'ar';
      }

      const currentLang = detectLanguage();
      const strings = LOCALES[currentLang] || LOCALES.ar;

      // Apply HTML Attributes & Direction
      document.documentElement.lang = currentLang;
      document.documentElement.dir = strings.dir;

      // Apply Page Metadata
      document.title = strings.title;
      const metaTitle = document.getElementById('meta-title');
      const metaDesc = document.getElementById('meta-desc');
      const ogTitle = document.getElementById('og-title');
      const ogDesc = document.getElementById('og-desc');
      const twTitle = document.getElementById('tw-title');
      const twDesc = document.getElementById('tw-desc');

      if (metaTitle) metaTitle.content = strings.title;
      if (metaDesc) metaDesc.content = strings.description;
      if (ogTitle) ogTitle.content = strings.title;
      if (ogDesc) ogDesc.content = strings.description;
      if (twTitle) twTitle.content = strings.title;
      if (twDesc) twDesc.content = strings.description;

      // Apply UI Strings
      const nameEl = document.getElementById('app-name');
      const tagEl = document.getElementById('app-tagline');
      const loadEl = document.getElementById('loading-text');
      const featList = document.getElementById('features-list');

      if (nameEl) nameEl.textContent = strings.appName;
      if (tagEl) tagEl.textContent = strings.tagline;
      if (loadEl) loadEl.textContent = strings.loading;

      if (featList && strings.features) {
        featList.innerHTML = '';
        strings.features.forEach(function (f) {
          const span = document.createElement('span');
          span.className = 'feature-badge';
          span.textContent = f;
          featList.appendChild(span);
        });
      }

      // Smooth Dismissal when Flutter View is Ready
      function dismissSplash() {
        const splash = document.getElementById('boshra-splash');
        if (splash && !splash.classList.contains('fade-out')) {
          splash.classList.add('fade-out');
          setTimeout(function () {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 650);
        }
      }

      window.addEventListener('flutter-first-frame', dismissSplash);

      const observer = new MutationObserver(function (mutations, obs) {
        if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view')) {
          setTimeout(dismissSplash, 400);
          obs.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Fallback timer in case observer doesn't catch
      setTimeout(dismissSplash, 8000);
    })();
  </script>

  <!-- Flutter Web Bootstrap -->
  <script src="flutter_bootstrap.js" async></script>
</body>
